{% extends 'base.html' %}
{% block title %}Mathematics Club Blog | DBIT endblock{% block content %}
<section class="page"><h1>Club journal</h1>
    <div class="mt-6 grid gap-5 md:grid-cols-2">
        {% for post in posts %}<article class="card">
            <p class="text-sm text-cyan-300">{{ post.published_at|date:'F j, Y' }}</p>
            <h2 class="mt-2 text-xl font-bold"><a href="{{ post.get_absolute_url }}">{{ post.title }}</a></h2>
            <p class="mt-3 text-slate-400">{{ post.excerpt }}</p></article>{% empty %}
            <p class="text-slate-400">No posts have been published yet.</p>{% endfor %}</div>
        </section>{% endblock %}
