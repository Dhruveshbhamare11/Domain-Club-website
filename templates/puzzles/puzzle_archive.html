{% extends 'base.html' %}{% block title %}Puzzle Archive | Mathematics Club{% endblock %}{% block content %}<section class="page"><h1>Puzzle archive</h1><div class="mt-6 grid gap-4">{% for puzzle in puzzles %}<a class="card" href="{% url 'puzzles:detail' puzzle.pk %}"><strong>{{ puzzle.title }}</strong><p class="text-slate-400">Closed {{ puzzle.end_time|date:'M j, Y' }}</p></a>{% empty %}<p class="text-slate-400">There are no completed puzzles yet.</p>{% endfor %}</div></section>{% endblock %}
