<article class="article-card stagger-item">{% if post.featured_image %}<a class="article-image image-cutout" href="{{ post.get_absolute_url }}"><img src="{{ post.featured_image.url }}" alt="{{ post.title }}"></a>{% endif %}<p class="section-kicker">{{ post.published_at|date:'d M Y' }} · Club journal</p><h2 class="mt-3"><a href="{{ post.get_absolute_url }}">{{ post.title }}</a></h2><p class="mt-4 max-w-md">{{ post.excerpt }}</p><a class="text-link inline-block mt-5 text-sm" href="{{ post.get_absolute_url }}">Read article →</a></article>
