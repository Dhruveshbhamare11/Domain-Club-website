<article class="badge-sticker stagger-item"><span class="badge-icon" aria-hidden="true">{% if badge.icon_name == 'bolt' %}⚡{% elif badge.icon_name == 'flame' %}🔥{% elif badge.icon_name == 'rocket' %}🚀{% elif badge.icon_name == 'trophy' %}🏆{% elif badge.icon_name == 'crown' %}👑{% elif badge.icon_name == 'star' %}⭐{% else %}✦{% endif %}</span><h2>{{ badge.name }}</h2><p class="mt-2 text-sm">{{ badge.description }}</p></article>
