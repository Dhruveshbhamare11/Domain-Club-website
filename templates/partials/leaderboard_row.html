<article class="leaderboard-row stagger-item"><span class="leaderboard-rank">#{{ rank|stringformat:"02d" }}</span>
    <div><strong class="text-lg">{{ profile.user.get_full_name|default:profile.user.username }}</strong>
        <p class="text-sm">{{ profile.branch }} · {{ profile.year }} · 🔥 {{ profile.current_streak }} streak</p></div><div class="leaderboard-points">{{ profile.points }}<span class="block text-xs tracking-widest">PTS</span></div></article>
