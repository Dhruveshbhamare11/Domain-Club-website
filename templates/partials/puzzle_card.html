{% if puzzle %}<article class="rounded-xl border border-cyan-700 bg-slate-900 p-6"><p class="text-sm text-cyan-300">Weekly challenge</p><h3 class="mt-2 text-2xl font-bold">{{ puzzle.title }}</h3><p class="mt-3 text-slate-300">{{ puzzle.content|truncatechars:160 }}</p><a class="btn mt-5" href="{% url 'puzzles:detail' puzzle.pk %}">Solve the puzzle</a></article>{% else %}<article class="rounded-xl border border-slate-700 p-6"><h3 class="font-bold">No live puzzle</h3><p class="mt-2 text-slate-400">The next challenge will appear here when it begins.</p></article>{% endif %}
