<article class="event-poster hover-lift stagger-item"><div class="event-date"><span>{{ event.date|date:'d' }}</span><small>{{ event.date|date:'M Y' }}</small></div><div class="event-copy"><p class="section-kicker">{{ event.time|time:'g:i A' }} · {{ event.location }}</p><h2 class="mt-3"><a href="{{ event.get_absolute_url }}">{{ event.title }}</a></h2><p class="mt-3 text-sm">{{ event.description|truncatechars:130 }}</p><a class="text-link inline-block mt-4 text-sm" href="{{ event.get_absolute_url }}">Explore event →</a></div>{% if event.image %}<a class="event-image image-cutout alt" href="{{ event.get_absolute_url }}"><img src="{{ event.image.url }}" alt="{{ event.title }} event"></a>{% endif %}</article>
